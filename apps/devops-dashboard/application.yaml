apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devops-dashboard
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/SAkib-Miirza/argo-gitops-lab.git
    targetRevision: main
    path: apps/devops-dashboard
  destination:
    server: https://kubernetes.default.svc
    namespace: devops-dashboard
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
